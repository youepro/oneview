backend:
  name: github
  repo: youepro/oneview
  branch: main
  base_url: https://oneview-oauth.honeyoue.workers.dev
  auth_endpoint: auth
  commit_message: "chore: update via CMS"

media_folder: docs/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    folder: docs/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 日期, name: date, widget: datetime, format: YYYY-MM-DD}
      - {label: 标签, name: tags, widget: list, required: false}
      - {label: 摘要, name: description, widget: text, required: false}
      - {label: 正文, name: body, widget: markdown}